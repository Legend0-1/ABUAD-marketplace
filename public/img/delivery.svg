<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450" role="img" aria-label="Delivery truck carrying a parcel to a destination">
  <defs>
    <linearGradient id="d-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#131d2e"/>
      <stop offset="1" stop-color="#0a1017"/>
    </linearGradient>
    <radialGradient id="d-glow" cx="50%" cy="16%" r="62%">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="d-box" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#22b8cf"/>
    </linearGradient>
    <linearGradient id="d-cab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <rect width="600" height="450" fill="url(#d-bg)"/>
  <rect width="600" height="450" fill="url(#d-glow)"/>

  <!-- speed lines -->
  <g stroke="#5eead4" stroke-width="6" stroke-linecap="round" opacity="0.5">
    <line x1="66" y1="208" x2="140" y2="208"/>
    <line x1="50" y1="250" x2="150" y2="250"/>
    <line x1="72" y1="292" x2="134" y2="292"/>
  </g>

  <!-- ground -->
  <line x1="96" y1="362" x2="516" y2="362" stroke="#ffffff" stroke-opacity="0.12" stroke-width="4" stroke-linecap="round"/>

  <!-- truck -->
  <rect x="165" y="175" width="185" height="140" rx="12" fill="url(#d-box)"/>
  <rect x="300" y="188" width="40" height="114" rx="6" fill="#0a1017" opacity="0.15"/>

  <!-- parcel inside cargo (delivery motif) -->
  <rect x="196" y="206" width="74" height="68" rx="6" fill="#0b1119" opacity="0.9"/>
  <rect x="196" y="206" width="74" height="68" rx="6" fill="none" stroke="#f1f5f9" stroke-width="3" opacity="0.9"/>
  <line x1="233" y1="206" x2="233" y2="274" stroke="#f1f5f9" stroke-width="3" opacity="0.9"/>
  <line x1="196" y1="240" x2="270" y2="240" stroke="#f1f5f9" stroke-width="3" opacity="0.6"/>

  <!-- cab -->
  <path d="M350 205 h55 a20 20 0 0 1 16 8 l34 47 a14 14 0 0 1 3 9 v46 h-108 z" fill="url(#d-cab)"/>
  <path d="M360 214 h44 a10 10 0 0 1 8 4 l23 33 h-75 z" fill="#0b1119" opacity="0.55"/>
  <rect x="452" y="288" width="9" height="16" rx="3" fill="#fde68a"/>

  <!-- wheels -->
  <g>
    <circle cx="235" cy="330" r="36" fill="#0b1119"/>
    <circle cx="235" cy="330" r="36" fill="none" stroke="#5eead4" stroke-width="6"/>
    <circle cx="235" cy="330" r="12" fill="#5eead4"/>
    <circle cx="405" cy="330" r="36" fill="#0b1119"/>
    <circle cx="405" cy="330" r="36" fill="none" stroke="#5eead4" stroke-width="6"/>
    <circle cx="405" cy="330" r="12" fill="#5eead4"/>
  </g>

  <!-- destination pin -->
  <g transform="translate(432,116)">
    <path d="M0 0 C 22 0 22 26 0 47 C -22 26 -22 0 0 0 Z" fill="#34d399"/>
    <circle cx="0" cy="17" r="8" fill="#0a1017"/>
  </g>
</svg>
