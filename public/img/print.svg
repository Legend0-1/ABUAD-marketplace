<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450" role="img" aria-label="Photocopier and printing machine printing a page">
  <defs>
    <linearGradient id="p-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#131d2e"/>
      <stop offset="1" stop-color="#0a1017"/>
    </linearGradient>
    <radialGradient id="p-glow" cx="50%" cy="14%" r="62%">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="p-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#22b8cf"/>
    </linearGradient>
  </defs>

  <rect width="600" height="450" fill="url(#p-bg)"/>
  <rect width="600" height="450" fill="url(#p-glow)"/>

  <!-- top scanner / document feeder -->
  <rect x="205" y="104" width="190" height="30" rx="10" fill="url(#p-top)"/>
  <rect x="243" y="92" width="114" height="16" rx="6" fill="#f8fafc" opacity="0.9"/>

  <!-- machine main body -->
  <rect x="185" y="146" width="230" height="132" rx="18" fill="url(#p-body)"/>

  <!-- control panel -->
  <rect x="322" y="166" width="72" height="46" rx="8" fill="#0a1017" opacity="0.85"/>
  <rect x="330" y="174" width="36" height="16" rx="4" fill="#5eead4" opacity="0.9"/>
  <circle cx="376" cy="182" r="5" fill="#5eead4"/>
  <circle cx="376" cy="200" r="5" fill="#f8fafc" opacity="0.7"/>
  <circle cx="358" cy="200" r="5" fill="#f8fafc" opacity="0.5"/>
  <circle cx="340" cy="200" r="5" fill="#f8fafc" opacity="0.5"/>

  <!-- side paper input tray -->
  <path d="M185 168 l-46 -14 v20 l46 12 z" fill="#22b8cf"/>
  <rect x="150" y="150" width="34" height="4" rx="2" fill="#f8fafc" opacity="0.8"/>

  <!-- output slot -->
  <rect x="206" y="250" width="150" height="12" rx="6" fill="#0a1017" opacity="0.85"/>

  <!-- printed page emerging -->
  <rect x="220" y="256" width="150" height="118" rx="6" fill="#f8fafc"/>
  <rect x="234" y="272" width="122" height="15" rx="4" fill="#34d399"/>
  <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round">
    <line x1="236" y1="304" x2="354" y2="304"/>
    <line x1="236" y1="322" x2="354" y2="322"/>
    <line x1="236" y1="340" x2="320" y2="340"/>
  </g>

  <!-- feet -->
  <rect x="205" y="278" width="24" height="16" rx="4" fill="#0a1017" opacity="0.5"/>
  <rect x="371" y="278" width="24" height="16" rx="4" fill="#0a1017" opacity="0.5"/>
</svg>
